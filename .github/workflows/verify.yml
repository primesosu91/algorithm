name: Verify library repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check catalog and snippets, compile C++23, and run regression tests
        run: python3 tools/check_repository.py
      - name: Run regression tests with AddressSanitizer and UBSan
        run: python3 tools/check_repository.py --sanitizers --skip-syntax
